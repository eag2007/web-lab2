# Локальный Apache httpd: /etc/apache2/sites-available/orchestrator.conf
# Нужны модули proxy и proxy_fcgi (a2enmod proxy proxy_fcgi) и доступ www-data к папке проекта:
#   sudo setfacl -m u:www-data:x /home/evgeniy
# Включение: sudo a2ensite orchestrator && sudo systemctl reload apache2

Listen 8888

<VirtualHost *:8888>
    # Статика (html, css, js, картинки)
    DocumentRoot /home/evgeniy/WebstormProjects/Lab2/frontend

    <Directory /home/evgeniy/WebstormProjects/Lab2/frontend>
        Require all granted
    </Directory>

    # Динамика: /api/... уходит на FastCGI-сервер (java -DFCGI_PORT=24001 -jar orchestrator-...-all.jar)
    ProxyPass "/api/" "fcgi://127.0.0.1:24001/api"

    ErrorLog ${APACHE_LOG_DIR}/orchestrator-error.log
    CustomLog ${APACHE_LOG_DIR}/orchestrator-access.log combined
</VirtualHost>
